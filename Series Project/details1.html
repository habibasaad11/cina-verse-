
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Series . Details</title>

    <link rel="stylesheet" href="details1.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>


<body>


    <nav class="navbar">

        <h1 class="logo">
            Series<span></span>
        </h1>

        <div class="nav-links">

            <a href="#index.html">
                Home
            </a>

            <a href="#movie.html">
                Movies
            </a>

            <a href="series.html">
                Series
            </a>

            <a href="series.html#contact">
                Contact
            </a>

        </div>

    </nav>


    <main class="details-container">



        <a href="series.html" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Series

        </a>


        <section class="details-card">



            <div class="poster">

                <img id="seriesPoster"
                     src=""
                     alt="Series Poster">

            </div>


            <div class="details-info">


                <p class="details-label">

                    SERIES DETAILS

                </p>


                <h1 id="seriesTitle"></h1>


                <div class="meta">

                    <span id="seriesYear"></span>

                    <span>•</span>

                    <span id="seriesGenre"></span>

                    <span>•</span>

                    <span id="seriesSeasons"></span>

                </div>



                <div class="rating-box">

                    <span class="star">
                        ★
                    </span>

                    <span id="seriesRating"></span>

                    <small>
                        / 10
                    </small>

                </div>


           

                <p id="seriesDescription"
                   class="description">
                </p>



                <div class="info-grid">


                    <div>

                        <span>Genre</span>

                        <strong id="infoGenre"></strong>

                    </div>


                    <div>

                        <span>Release</span>

                        <strong id="infoYear"></strong>

                    </div>


                    <div>

                        <span>Seasons</span>

                        <strong id="infoSeasons"></strong>

                    </div>


                    <div>

                        <span>Language</span>

                        <strong id="infoLanguage"></strong>

                    </div>


                </div>



                <button class="watch-btn"
                        id="watchBtn">

                    <i class="fa-solid fa-play"></i>

                    Watch Trailer

                </button>


            </div>

        </section>

        <section class="extra-info">

            <h2>
                About This Series
            </h2>

            <div class="line"></div>

            <p id="aboutText"></p>

        </section>


    </main>


    <footer>

        <p>
            © 2026 Series. All Rights Reserved.
        </p>

        <p>
            Designed & Developed by
            <span>Salwa Mohamed</span>
        </p>

    </footer>


    <script src="details1.js"></script>

</body>

</html>
